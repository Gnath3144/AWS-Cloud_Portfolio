version: '3.8'

services:
  app:
    build: .
    container_name: gopinath_portfolio_app
    restart: always
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:-gopinath_admin_secret_key_2026}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - RATE_LIMIT_REQUESTS=30
      - RATE_LIMIT_WINDOW_SECONDS=60
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: gopinath_portfolio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
    depends_on:
      - app
